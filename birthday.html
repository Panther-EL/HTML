<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Birthday.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">
</head>

<body>
    <div class="birthday">
        <h1>Today is Elorm's birthday</h1>
        <img src="pictures/personal image.jpg" class="elorm" alt="An image of Elorm">
        <h2 id="bday-age">19 years old</h2>
        <h4 id="bday-date">05.10.2025</h4>
    </div>

    <div class="gift-section">
        <h2 class="gift-title">Here's how happy I am for you today</h2>
        <h3 class="gift-hint">Hover over the gift</h3>
        <div class="gift" id="first-gift"></div>
    </div>


    <div class="gift-section">
        <h2 class="gift-title">Here's how happy I am for you today</h2>
        <div class="gift" id="second-gift"></div>
    </div>

    <div class="gift-section">
        <h2 class="gift-title">Here's how happy I am for you today</h2>
        <div class="gift" id="third-gift"></div>
    </div>

    <div class="gift-section">
        <h2 class="gift-title">Here's how happy I am for you today</h2>
        <div class="gift" id="fourth-gift"></div>
    </div>

    <p id="footer">Want to create your own Birthday gift site? Take <a href="https://scrimba.com/learn/htmlandcss" target="_blank"> this HTML & CSS course</a></p>
    

    

    
</body>
</html>
